<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chameleon Review</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --text: #1d1b19; --muted: #6b665f; --line: #e3dfd8;
    --stage: #ebe8e2; --good: #2f7d4f; --okay: #a76b00; --bad: #b3261e; --accent: #3b5bdb;
    --bar: #d9d4cb; --bar-fill: #c2410c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161514; --card: #1f1e1c; --text: #ece8e1; --muted: #a39d94; --line: #34312d;
      --stage: #2a2825; --good: #5cc48a; --okay: #e0a43a; --bad: #f2776e; --accent: #8ea6ff;
      --bar: #3a3632; --bar-fill: #f08a4b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line);
           padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
  h1 { font-size: 16px; margin: 0; }
  .meta { color: var(--muted); }
  .progress { display: flex; gap: 12px; font-variant-numeric: tabular-nums; }
  .progress b { font-weight: 600; }
  .controls { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  select { font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line);
           background: var(--card); color: var(--text); }
  main { padding: 16px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 720px), 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px;
          display: flex; flex-direction: column; gap: 12px; }
  .card[data-verdict="good"] { border-color: var(--good); }
  .card[data-verdict="okay"] { border-color: var(--okay); }
  .card[data-verdict="bad"] { border-color: var(--bad); }
  .title { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .title h2 { font-size: 15px; margin: 0; }
  .title .size { color: var(--muted); font-weight: 400; }
  .score { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  figure { margin: 0; display: flex; flex-direction: column; gap: 4px; }
  figcaption { color: var(--muted); font-size: 12px; }
  .stage { background: var(--stage); border-radius: 6px; height: 220px; display: flex;
           align-items: center; justify-content: center; padding: 6px; }
  .stage img { max-width: 100%; max-height: 100%; display: block; cursor: zoom-in; }
  .stage .none { color: var(--muted); font-size: 12px; text-align: center; padding: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
  td { padding: 2px 0; }
  td.name { width: 34%; color: var(--muted); }
  td.val { width: 14%; text-align: right; padding-right: 8px; }
  .bar { height: 6px; background: var(--bar); border-radius: 3px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--bar-fill); }
  .violations { font-size: 12px; margin: 0; padding-left: 18px; color: var(--bad); }
  .ok { font-size: 12px; color: var(--good); }
  .verdicts { display: flex; gap: 8px; align-items: center; }
  .verdicts button { flex: 1; font: inherit; font-weight: 600; padding: 8px; border-radius: 8px; cursor: pointer;
                     border: 1px solid var(--line); background: transparent; color: var(--text); }
  .verdicts button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .verdicts button[data-v="good"][aria-pressed="true"] { background: var(--good); border-color: var(--good); color: #fff; }
  .verdicts button[data-v="okay"][aria-pressed="true"] { background: var(--okay); border-color: var(--okay); color: #fff; }
  .verdicts button[data-v="bad"][aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: #fff; }
  .status { font-size: 12px; color: var(--muted); min-height: 1em; }
  .status.err { color: var(--bad); }
  .empty, .error { padding: 40px 16px; color: var(--muted); text-align: center; grid-column: 1 / -1; }
  dialog { border: none; padding: 0; background: transparent; max-width: 96vw; max-height: 96vh; }
  dialog::backdrop { background: rgb(0 0 0 / 0.75); }
  dialog img { max-width: 96vw; max-height: 92vh; display: block; }
  @media (max-width: 600px) { .stage { height: 120px; } .controls { margin-left: 0; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>Chameleon benchmark review</h1>
    <div class="meta" id="meta">Loading…</div>
  </div>
  <div class="progress" id="progress"></div>
  <div class="controls">
    <label>Show
      <select id="filter">
        <option value="all">All cases</option>
        <option value="unlabelled">Unlabelled</option>
        <option value="good">Good</option>
        <option value="okay">Okay</option>
        <option value="bad">Bad</option>
        <option value="failing">Failing a hard rule</option>
      </select>
    </label>
    <label>Sort
      <select id="sort">
        <option value="order">Benchmark order</option>
        <option value="score-asc">Score, lowest first</option>
        <option value="score-desc">Score, highest first</option>
      </select>
    </label>
  </div>
</header>
<main id="cases"></main>
<dialog id="zoom"><img alt=""></dialog>

<script>
const VERDICTS = [["good", "Good"], ["okay", "Okay"], ["bad", "Bad"]];
let cases = [], labels = {};
const $ = (s) => document.querySelector(s);

function el(tag, attrs = {}, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of children) if (c != null) n.append(c);
  return n;
}

function stage(src, alt) {
  const box = el("div", { class: "stage" });
  if (src) {
    const img = el("img", { src, alt, loading: "lazy" });
    img.addEventListener("click", () => { const d = $("#zoom"); d.querySelector("img").src = src; d.showModal(); });
    box.append(img);
  } else {
    box.append(el("div", { class: "none" }, "No render. Run python -m eval.bench --render"));
  }
  return box;
}

function card(c) {
  const verdict = labels[c.case]?.verdict || "";
  const status = el("div", { class: "status", role: "status" });
  const buttons = VERDICTS.map(([v, label]) => el("button", {
    type: "button", "data-v": v, "aria-pressed": String(verdict === v),
    onclick: () => save(c.case, verdict === v ? null : v, status),  // clicking the active verdict clears it
  }, label));

  const rows = Object.entries(c.penalties).map(([k, p]) => el("tr", {},
    el("td", { class: "name" }, k.replace("_", " ")),
    el("td", { class: "val" }, p.toFixed(3)),
    el("td", {}, (() => { const b = el("div", { class: "bar" }); b.append(el("span", { style: `width:${Math.min(100, p * 100)}%` })); return b; })()),
  ));

  return el("article", { class: "card", "data-verdict": verdict, id: c.case },
    el("div", { class: "title" },
      el("h2", {}, `${c.sample} → ${c.format} `, el("span", { class: "size" }, `${c.width}×${c.height}`)),
      el("div", { class: "score", title: "Geometric + contrast score, 0–100" }, c.total.toFixed(1))),
    el("div", { class: "trio" },
      el("figure", {}, stage(c.source_png, `Original design ${c.sample}`), el("figcaption", {}, "Original, original size")),
      el("figure", {}, stage(c.stretch_png, `Naive stretch of ${c.sample} to ${c.format}`), el("figcaption", {}, "Naive stretch (starter)")),
      el("figure", {}, stage(c.output_png, `Our output for ${c.format}`), el("figcaption", {}, "Our engine"))),
    el("table", { "aria-label": "Penalty breakdown (0 = perfect, 1 = worst)" }, el("tbody", {}, ...rows)),
    c.violations.length
      ? el("ul", { class: "violations", "aria-label": "Hard-rule violations" }, ...c.violations.map((v) => el("li", {}, `${v.rule}: ${v.id}`)))
      : el("div", { class: "ok" }, "Passes every hard rule"),
    el("div", { class: "verdicts", role: "group", "aria-label": "Your verdict" }, ...buttons),
    status,
  );
}

async function save(caseId, verdict, status) {
  status.className = "status"; status.textContent = "Saving…";
  try {
    const r = await fetch("/api/labels", { method: "POST", headers: { "Content-Type": "application/json" },
                                           body: JSON.stringify({ case: caseId, verdict }) });
    if (!r.ok) throw new Error(await r.text());
    labels = await r.json();
    // update only this card (keeps scroll, focus, and the card visible until the filter changes)
    const fresh = card(cases.find((c) => c.case === caseId));
    document.getElementById(caseId).replaceWith(fresh);
    fresh.querySelector(".status").textContent = verdict ? "Saved" : "Cleared";
    (fresh.querySelector(`button[data-v="${verdict}"]`) || fresh.querySelector("button")).focus();
    renderProgress();
  } catch (e) {
    status.className = "status err"; status.textContent = `Not saved: ${e.message}. Is review_server.py running?`;
  }
}

function render() {
  const f = $("#filter").value, s = $("#sort").value;
  let list = cases.filter((c) => {
    const v = labels[c.case]?.verdict;
    return f === "all" || (f === "unlabelled" && !v) || (f === "failing" && c.violations.length) || v === f;
  });
  if (s === "score-asc") list = [...list].sort((a, b) => a.total - b.total);
  if (s === "score-desc") list = [...list].sort((a, b) => b.total - a.total);
  const main = $("#cases");
  main.replaceChildren(...(list.length ? list.map(card) : [el("div", { class: "empty" }, "No cases match this filter.")]));
  renderProgress();
}

function renderProgress() {
  const counts = { good: 0, okay: 0, bad: 0 };
  for (const c of cases) { const v = labels[c.case]?.verdict; if (v) counts[v]++; }
  const done = counts.good + counts.okay + counts.bad;
  $("#progress").replaceChildren(
    el("span", {}, el("b", {}, `${done}/${cases.length}`), " labelled"),
    el("span", { style: "color:var(--good)" }, `${counts.good} good`),
    el("span", { style: "color:var(--okay)" }, `${counts.okay} okay`),
    el("span", { style: "color:var(--bad)" }, `${counts.bad} bad`));
}

async function init() {
  try {
    const [cr, lr] = await Promise.all([fetch("/api/cases"), fetch("/api/labels")]);
    if (!cr.ok) throw new Error(`cases: ${cr.status}`);
    const data = await cr.json();
    cases = data.cases; labels = lr.ok ? await lr.json() : {};
    const avg = cases.reduce((a, c) => a + c.total, 0) / Math.max(1, cases.length);
    const passed = cases.filter((c) => !c.violations.length).length;
    $("#meta").textContent = `Engine ${data.commit} · ${cases.length} cases · ${passed} pass every hard rule · average score ${avg.toFixed(2)}`;
    render();
  } catch (e) {
    $("#meta").textContent = "";
    $("#cases").replaceChildren(el("div", { class: "error" },
      `Couldn't load results (${e.message}). Run python -m eval.bench --render, then python -m eval.review_server.`));
  }
}
$("#filter").addEventListener("change", render);
$("#sort").addEventListener("change", render);
$("#zoom").addEventListener("click", () => $("#zoom").close());
init();
</script>
</body>
</html>
